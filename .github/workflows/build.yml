# On every commit to main: build WacOS (build.cmd plus the 32/64-bit title bar DLLs), write the version to
# bin\versao.txt and publish the update package as the "latest" GitHub release. The "Update Now" button in
# System Settings (tools\atualizar-github.ps1) compares that version with the installed one and downloads it
# only when there is something new.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sequential: one more than the releases that exist (they were reset to build-1 on 2026-11-17)
          $n = @(gh release list --limit 1000 --json tagName --jq '.[].tagName' | Where-Object { $_ -match '^build-\d+$' }).Count + 1
          $tag = "build-$n"
          New-Item -ItemType Directory -Force bin | Out-Null
          Set-Content -Encoding utf8 bin\versao.txt @($tag, "${{ github.sha }}", (Get-Date -Format 'yyyy-MM-dd HH:mm'))
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          call build.cmd janelas || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\empacotar.ps1 -SemSistema -Atualizacao -Zip "$PWD\dist\WacOS.zip"
          if (-not (Test-Path dist\WacOS.zip)) { throw 'the package was not created' }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = git describe --tags --abbrev=0 HEAD~1 2>$null
          $notes = if ($prev) { git log --pretty=format:'- %s' "$prev..HEAD" } else { git log -20 --pretty=format:'- %s' }
          Set-Content -Encoding utf8 notes.md $notes
          gh release create $tag dist\WacOS.zip --title "WacOS $tag" --notes-file notes.md --latest
