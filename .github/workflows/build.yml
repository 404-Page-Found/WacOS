# A cada commit na main: compila o WacOS (build.cmd + a barra das janelas de 32/64 bits), grava a versão em
# bin\versao.txt e publica o pacote de atualização como a versão "latest" do GitHub. O botão "Atualizar Agora"
# do Ajustes (tools\atualizar-github.ps1) compara essa versão com a instalada e baixa só quando há novidade.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $tag = "build-${{ github.run_number }}"
          New-Item -ItemType Directory -Force bin | Out-Null
          Set-Content -Encoding utf8 bin\versao.txt @($tag, "${{ github.sha }}", (Get-Date -Format 'yyyy-MM-dd HH:mm'))
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Compilar
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          call build.cmd janelas || exit /b 1

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\empacotar.ps1 -SemSistema -Atualizacao -Zip "$PWD\dist\WacOS.zip"
          if (-not (Test-Path dist\WacOS.zip)) { throw 'o pacote não foi gerado' }

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          $antes = git describe --tags --abbrev=0 HEAD~1 2>$null
          $notas = if ($antes) { git log --pretty=format:'- %s' "$antes..HEAD" } else { git log -20 --pretty=format:'- %s' }
          Set-Content -Encoding utf8 notas.md $notas
          gh release create $tag dist\WacOS.zip --title "WacOS $tag" --notes-file notas.md --latest
